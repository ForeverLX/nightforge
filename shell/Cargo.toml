[package]
name = "nightforge-shell"
version = "0.1.0"
edition = "2021"
description = "S187 Phase 0 spike — wgpu layer-shell proof on Niri (text + rounded rect + gradient + animated quad)"
license = "MIT"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
# `system` backend required: wgpu's Vulkan WSI needs the real `wl_display*`
# pointer, which only the libwayland backend exposes (`display_ptr`).
wayland-client = { version = "0.31.14", features = ["system"] }
wgpu = "30.0.0"

# Spike iteration speed; not a production profile.
[profile.dev]
opt-level = 1
