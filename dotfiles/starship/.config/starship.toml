# NightForge Operator Starship Prompt
format = """\
[](#89b4fa)\
$os\
$username\
[](bg:#89b4fa fg:#1e1e2e)\
$directory\
[](fg:#89b4fa bg:#cba6f7)\
$git_branch\
$git_status\
[](fg:#cba6f7 bg:#a6e3a1)\
$node\
$python\
$rust\
$golang\
[](fg:#a6e3a1 bg:#f9e2af)\
$kubernetes\
$docker_context\
[](fg:#f9e2af bg:#fab387)\
$time\
[](fg:#fab387)\
$line_break\
$character\
"""

right_format = """\
$container\
$tmux\
$cmd_duration\
$status\
"""

# Disable default modules
add_newline = false
scan_for_ssh_keys = false

[os]
disabled = false
style = "bg:#89b4fa fg:#1e1e2e"
format = " [$symbol]($style)"

[username]
show_always = false
style_user = "bg:#89b4fa fg:#1e1e2e"
style_root = "bg:#89b4fa fg:#f38ba8"
format = " [$user]($style)"

[directory]
style = "bg:#89b4fa fg:#1e1e2e"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " 󰘬 "
style = "bg:#cba6f7 fg:#1e1e2e"
format = '[[ $symbol $branch ](bg:#cba6f7 fg:#1e1e2e)]($style)'

[git_status]
style = "bg:#cba6f7 fg:#1e1e2e"
format = '[[\($all_status$ahead_behind\)](bg:#cba6f7 fg:#1e1e2e)]($style)'
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[python]
symbol = " "
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[[ $symbol(\($version\) )](bg:#a6e3a1 fg:#1e1e2e)]($style)'

[container]
symbol = " 󰏖 "
style = "fg:#6c7086"
format = '[$symbol]($style)'

[tmux]
symbol = "  "
style = "fg:#6c7086"
format = '[$symbol(#S)]($style)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:#a6adc8"

[status]
style = "bg:#f38ba8 fg:#1e1e2e"
format = "[ $status ]($style)"
disabled = false

[time]
disabled = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
format = "$symbol "


































































































































































































































































































































































































