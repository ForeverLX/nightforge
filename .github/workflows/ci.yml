name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-build:
    name: Go build + vet (harnessd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./cmd/harnessd/
      - run: go vet ./...

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: >
            .git
            .planning
            data
            dotfiles
            modules/nightowl
            niri-modifications

  bash-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          find . -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.planning/*' \
            -not -path './data/*' \
            -not -path './dotfiles/*' \
            -not -path './modules/nightowl/*' \
            -not -path './niri-modifications/*' \
            -print0 | xargs -0 -n1 bash -n
