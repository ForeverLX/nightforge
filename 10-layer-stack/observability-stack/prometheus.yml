global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agentgateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:31745
        labels:
          service: agentgateway
          layer: l4

  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:31750
        labels:
          service: nightforge
          layer: l4
